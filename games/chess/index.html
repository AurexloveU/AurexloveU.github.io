<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际象棋 · 奕苑</title>
<link rel="stylesheet" href="../assets/theme.css">
<script src="../assets/common.js"></script>
<script src="../assets/net.js"></script>
<script src="chess-engine.js"></script>
<style>
/* ---------- 棋盘 ---------- */
.board-wrap { display: flex; justify-content: center; }
.board {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  border: 6px solid var(--board-frame);
  border-radius: 8px;
  box-shadow: var(--shadow);
  user-select: none;
}
.sq {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.6rem, 6.2vmin, 3.1rem);
  line-height: 1;
  cursor: pointer;
}
.sq.light { background: var(--board-light); }
.sq.dark  { background: var(--board-dark); }
.sq.last::before {
  content: ""; position: absolute; inset: 0;
  background: var(--board-last);
}
.sq.check::before {
  content: ""; position: absolute; inset: 0;
  background: var(--board-check);
}
.sq.sel { outline: 3px solid var(--accent-ink); outline-offset: -3px; z-index: 1; }
.sq.hint::after {
  content: ""; position: absolute;
  width: 26%; height: 26%;
  border-radius: 50%;
  background: var(--board-hint);
}
.sq.hint.cap::after {
  width: 84%; height: 84%;
  background: transparent;
  border: 4px solid var(--board-hint);
}
.sq .pc { position: relative; z-index: 2; }
.sq .pc.w { color: #faf8fc; text-shadow: 0 0 2px #57506b, 0 1px 2px #57506b; }
.sq .pc.b { color: #38314a; text-shadow: 0 1px 1px rgba(255,255,255,0.35); }
.sq .coord {
  position: absolute; font-size: 0.62rem; opacity: 0.75;
  color: var(--accent-ink); z-index: 1; font-weight: 600;
}
.sq .coord.file { right: 3px; bottom: 1px; }
.sq .coord.rank { left: 3px; top: 1px; }

/* ---------- 侧栏 ---------- */
.mode-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.mode-row button { flex: 1; }
.field-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.45rem 0; flex-wrap: wrap; }
.field-row label { font-size: 0.88rem; color: var(--muted); white-space: nowrap; }
.field-row select, .field-row input[type="text"] { flex: 1; min-width: 0; }
.hidden { display: none !important; }

.captured-row {
  display: flex; justify-content: space-between; gap: 0.6rem;
  margin-top: 0.55rem; font-size: 1.15rem; min-height: 1.6em;
  color: var(--ink);
}
.captured-row .mdiff { color: var(--accent-ink); font-size: 0.85rem; align-self: center; }

#movelist {
  list-style: none; max-height: 330px; overflow-y: auto;
  font-size: 0.92rem; line-height: 1.9;
}
#movelist li { display: flex; gap: 0.5rem; border-bottom: 1px dashed var(--line); padding: 0 0.2rem; }
#movelist .no { color: var(--muted); width: 2.2em; flex: none; }
#movelist .mv { cursor: pointer; padding: 0 0.35rem; border-radius: 5px; min-width: 3.2em; }
#movelist .mv:hover { background: var(--accent-soft); }
#movelist .mv.cur { background: var(--accent); color: #fff; }
.replay-bar { display: flex; gap: 0.35rem; margin-bottom: 0.5rem; }
.replay-bar button { flex: 1; padding: 0.25rem 0.3rem; font-size: 0.85rem; }

.net-status { font-size: 0.85rem; color: var(--muted); min-height: 1.5em; margin-top: 0.3rem; }
.room-code { font-size: 1.35rem; letter-spacing: 0.35em; color: var(--accent-ink); font-weight: 700; }

/* 升变选择 */
.promo-row { display: flex; gap: 0.6rem; justify-content: center; }
.promo-row button { font-size: 2.2rem; line-height: 1; padding: 0.35rem 0.7rem; }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">国际象棋<small><a href="../index.html">← 返回奕苑</a></small></div>
  <nav class="site-nav"></nav>
</header>

<main class="container">
  <div class="game-layout">

    <section class="panel">
      <div class="status-line" id="status">—</div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="toolbar">
        <button id="btn-new" class="primary">新对局</button>
        <button id="btn-undo">悔 棋</button>
        <button id="btn-flip">翻转棋盘</button>
        <button id="btn-pgn">导出 PGN</button>
        <button id="btn-resign" class="hidden">认 输</button>
      </div>
      <div class="captured-row">
        <span id="cap-by-white" title="白方所获"></span>
        <span class="mdiff" id="mdiff"></span>
        <span id="cap-by-black" title="黑方所获"></span>
      </div>
    </section>

    <aside>
      <section class="panel">
        <h2 class="panel-title">对 局 设 置</h2>
        <div class="mode-row">
          <button id="mode-ai" class="on">人 机</button>
          <button id="mode-local">双 人</button>
          <button id="mode-online">联 机</button>
        </div>

        <div id="ai-opts">
          <div class="field-row">
            <label>我执</label>
            <select id="sel-side">
              <option value="w">白棋(先行)</option>
              <option value="b">黑棋(后行)</option>
            </select>
          </div>
          <div class="field-row">
            <label>难度</label>
            <select id="sel-level">
              <option value="1">一 · 随手</option>
              <option value="2" selected>二 · 入门</option>
              <option value="3">三 · 进阶</option>
              <option value="4">四 · 挑战</option>
            </select>
          </div>
        </div>

        <div id="online-opts" class="hidden">
          <div class="field-row">
            <label>昵称</label>
            <input type="text" id="in-name" maxlength="16" placeholder="Aurex">
          </div>
          <div class="field-row">
            <label>服务器</label>
            <input type="text" id="in-server" placeholder="ws://localhost:8787">
          </div>
          <div class="field-row">
            <button id="btn-create" class="primary" style="flex:1">创建房间</button>
          </div>
          <div class="field-row">
            <input type="text" id="in-room" maxlength="4" placeholder="房间号" style="text-transform:uppercase">
            <button id="btn-join">加 入</button>
          </div>
          <div class="net-status" id="net-status">未连接。启动 games/server 后端后可联机。</div>
          <div id="room-info" class="hidden">
            房间 <span class="room-code" id="room-code"></span>
            <span class="badge" id="my-side-badge"></span>
          </div>
        </div>
      </section>

      <section class="panel" style="margin-top:1rem;">
        <h2 class="panel-title">棋 谱 · 复 盘</h2>
        <div class="replay-bar">
          <button id="rp-first" title="开局">⏮</button>
          <button id="rp-prev" title="上一步">◀</button>
          <button id="rp-next" title="下一步">▶</button>
          <button id="rp-last" title="最新">⏭</button>
          <button id="rp-live">回到实战</button>
        </div>
        <ol id="movelist"></ol>
      </section>
    </aside>
  </div>
</main>

<!-- 升变选择 -->
<div class="overlay hidden" id="ov-promo">
  <div class="dialog">
    <h3>兵 升 变</h3>
    <div class="promo-row" id="promo-row"></div>
  </div>
</div>

<!-- 终局 -->
<div class="overlay hidden" id="ov-result">
  <div class="dialog">
    <h3 id="rs-title"></h3>
    <p id="rs-text" class="hint" style="margin-bottom:1rem;"></p>
    <div class="toolbar" style="justify-content:center;">
      <button id="rs-replay">复盘棋局</button>
      <button id="rs-new" class="primary">再来一局</button>
    </div>
  </div>
</div>

<p class="footer-note">王车易位 · 吃过路兵 · 升变 · 五十步 · 三次重复 —— 规则齐备,落子无悔亦可悔。</p>

<script>
(function () {
  "use strict";
  var E = window.ChessEngine;
  var sfx = window.Aurex.sfx;

  var GLYPH = { K:"♔", Q:"♕", R:"♖", B:"♗", N:"♘", P:"♙",
                k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" };
  var VAL = { P:1, N:3, B:3, R:5, Q:9, K:0 };
  var REASON_TXT = {
    checkmate: "将死", stalemate: "逼和(无子可动)", fifty: "五十步规则和棋",
    threefold: "三次重复局面和棋", material: "子力不足和棋",
    resign: "认输", "peer-leave": "对方离开"
  };

  var G = {
    mode: "ai",            // ai | local | online
    humanSide: "w",
    level: 2,
    state: E.initialState(),
    fens: [E.START_FEN],
    moves: [],             // {m, san}
    flip: false,
    view: null,            // null=实战;数字=复盘查看 fens[view]
    over: false, result: null, reason: null,
    thinking: false,
    sel: -1, legal: [],
    pendingPromo: null,
    net: null, netSide: null, netOn: false, peerName: null
  };

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $("board");

  /* ================= 棋盘渲染 ================= */
  var squares = [];
  function buildBoard() {
    boardEl.innerHTML = ""; squares = [];
    for (var d = 0; d < 64; d++) {
      var el = document.createElement("div");
      el.className = "sq";
      el.dataset.d = d;
      el.addEventListener("click", onSquareClick);
      boardEl.appendChild(el);
      squares.push(el);
    }
  }

  function dispToReal(d) { return G.flip ? 63 - d : d; }

  function viewState() {
    return G.view === null ? G.state : E.parseFEN(G.fens[G.view]);
  }
  function viewLastMove() {
    var n = G.view === null ? G.moves.length : G.view;
    return n > 0 ? G.moves[n - 1].m : null;
  }

  function render() {
    var s = viewState();
    var last = viewLastMove();
    var chkSq = -1;
    if (E.inCheck(s, s.turn)) chkSq = E.kingSq(s, s.turn);
    for (var d = 0; d < 64; d++) {
      var i = dispToReal(d);
      var el = squares[d];
      var lightSq = (((i >> 3) + (i & 7)) & 1) === 0;
      var cls = "sq " + (lightSq ? "light" : "dark");
      if (last && (i === last.from || i === last.to)) cls += " last";
      if (i === chkSq) cls += " check";
      if (i === G.sel && G.view === null) cls += " sel";
      var hintMove = null;
      if (G.view === null) {
        for (var h = 0; h < G.legal.length; h++) {
          if (G.legal[h].to === i) { hintMove = G.legal[h]; break; }
        }
      }
      if (hintMove) cls += " hint" + ((s.board[i] || hintMove.flags === "e") ? " cap" : "");
      el.className = cls;
      var p = s.board[i];
      var html = "";
      if (p) html += '<span class="pc ' + (p === p.toUpperCase() ? "w" : "b") + '">' + GLYPH[p] + "</span>";
      // 边缘坐标
      var f = i & 7, r = i >> 3;
      var isBottom = G.flip ? r === 0 : r === 7;
      var isLeft = G.flip ? f === 7 : f === 0;
      if (isBottom) html += '<span class="coord file">' + "abcdefgh"[f] + "</span>";
      if (isLeft) html += '<span class="coord rank">' + (8 - r) + "</span>";
      el.innerHTML = html;
    }
    renderCaptured(s);
    renderMoveList();
    renderStatus();
  }

  function renderCaptured(s) {
    var full = { P:8, N:2, B:2, R:2, Q:1, p:8, n:2, b:2, r:2, q:1 };
    for (var i = 0; i < 64; i++) {
      var p = s.board[i];
      if (p && full[p] !== undefined && full[p] > 0) full[p]--;
    }
    var byWhite = "", byBlack = "", diff = 0;
    ["q","r","b","n","p"].forEach(function (t) {
      for (var k = 0; k < full[t]; k++) { byWhite += GLYPH[t]; diff += VAL[t.toUpperCase()]; }
    });
    ["Q","R","B","N","P"].forEach(function (t) {
      for (var k = 0; k < full[t]; k++) { byBlack += GLYPH[t]; diff -= VAL[t]; }
    });
    $("cap-by-white").textContent = byWhite;
    $("cap-by-black").textContent = byBlack;
    $("mdiff").textContent = diff === 0 ? "" : (diff > 0 ? "白 +" + diff : "黑 +" + (-diff));
  }

  function renderMoveList() {
    var ol = $("movelist");
    ol.innerHTML = "";
    for (var i = 0; i < G.moves.length; i += 2) {
      var li = document.createElement("li");
      var no = document.createElement("span");
      no.className = "no"; no.textContent = (i / 2 + 1) + ".";
      li.appendChild(no);
      for (var j = i; j < Math.min(i + 2, G.moves.length); j++) {
        var sp = document.createElement("span");
        sp.className = "mv";
        var viewing = G.view === null ? G.moves.length : G.view;
        if (viewing === j + 1) sp.className += " cur";
        sp.textContent = G.moves[j].san;
        sp.dataset.idx = j + 1;
        sp.addEventListener("click", function () {
          setView(parseInt(this.dataset.idx, 10));
        });
        li.appendChild(sp);
      }
      ol.appendChild(li);
    }
    ol.scrollTop = ol.scrollHeight;
  }

  function renderStatus() {
    var el = $("status");
    if (G.view !== null) {
      el.innerHTML = "复盘 · 第 " + G.view + " 步 / 共 " + G.moves.length + " 步 <span class='hint'>(点「回到实战」继续)</span>";
      return;
    }
    if (G.over) {
      var t = G.result === "1/2-1/2" ? "和棋" : (G.result === "1-0" ? "白方胜" : "黑方胜");
      el.innerHTML = "<span class='good'>对局结束 · " + t + " · " + (REASON_TXT[G.reason] || G.reason || "") + "</span>";
      return;
    }
    var turnTxt = G.state.turn === "w" ? "白方" : "黑方";
    var chk = E.inCheck(G.state, G.state.turn) ? " <span class='warn'>将军!</span>" : "";
    if (G.thinking) { el.innerHTML = turnTxt + "行棋 · 电脑思考中…"; return; }
    if (G.mode === "ai") {
      el.innerHTML = (G.state.turn === G.humanSide ? "轮到你了(" + turnTxt + ")" : turnTxt + "行棋") + chk;
    } else if (G.mode === "online") {
      if (!G.netOn) { el.innerHTML = "联机模式 · 等待建立对局"; return; }
      el.innerHTML = (G.state.turn === G.netSide ? "轮到你了(" + turnTxt + ")" : "等待对方(" + turnTxt + ")…") + chk;
    } else {
      el.innerHTML = turnTxt + "行棋" + chk;
    }
  }

  /* ================= 对局流程 ================= */
  function repCount() {
    var key = E.positionKey(G.state), n = 0;
    for (var i = 0; i < G.fens.length; i++) {
      if (G.fens[i].split(" ").slice(0, 4).join(" ") === key) n++;
    }
    return n;
  }

  function newGame() {
    G.state = E.initialState();
    G.fens = [E.START_FEN];
    G.moves = [];
    G.over = false; G.result = null; G.reason = null;
    G.view = null; G.sel = -1; G.legal = []; G.thinking = false;
    hideOverlays();
    if (G.mode === "ai") G.flip = G.humanSide === "b";
    if (G.mode === "online") G.flip = G.netSide === "b";
    render();
    maybeAI();
  }

  /** 应用一步合法着法(来源:本地点击 / AI / 网络) */
  function playMove(m, fromNet) {
    if (G.over) return;
    var sanStr = E.san(G.state, m);
    var isCap = !!G.state.board[m.to] || m.flags === "e";
    E.makeMove(G.state, m);
    G.fens.push(E.toFEN(G.state));
    G.moves.push({ m: m, san: sanStr });
    G.sel = -1; G.legal = []; G.view = null;

    var st = E.gameStatus(G.state, repCount());
    if (st.over) {
      G.over = true; G.result = st.result; G.reason = st.reason;
    }

    if (isCap) sfx.capture(); else sfx.move();
    if (!G.over && E.inCheck(G.state, G.state.turn)) sfx.check();

    if (G.mode === "online" && !fromNet && G.net) {
      G.net.sendMove({ from: m.from, to: m.to, promo: m.promo || null });
      if (G.over) G.net.sendResult(G.result, G.reason);
    }

    render();
    if (G.over) showResult();
    else maybeAI();
  }

  function maybeAI() {
    if (G.mode !== "ai" || G.over || G.state.turn === G.humanSide || G.thinking) return;
    G.thinking = true;
    renderStatus();
    setTimeout(function () {
      var r = E.bestMove(G.state, G.level);
      G.thinking = false;
      if (r && r.move) playMove(r.move);
      else render();
    }, 120);
  }

  /* ---------------- 点击走子 ---------------- */
  function myTurn() {
    if (G.over || G.thinking || G.view !== null) return false;
    if (G.mode === "ai") return G.state.turn === G.humanSide;
    if (G.mode === "online") return G.netOn && G.state.turn === G.netSide;
    return true; // local
  }

  function onSquareClick() {
    if (!myTurn()) { if (G.view !== null) sfx.illegal(); return; }
    var i = dispToReal(parseInt(this.dataset.d, 10));
    var p = G.state.board[i];

    // 已选中 → 尝试落子
    if (G.sel >= 0) {
      var cands = G.legal.filter(function (m) { return m.to === i; });
      if (cands.length === 1) { playMove(cands[0]); return; }
      if (cands.length > 1) { askPromotion(cands); return; } // 升变四选一
    }
    // 选中己方棋子
    var meWhite = G.state.turn === "w";
    if (p && (p === p.toUpperCase()) === meWhite) {
      if (i === G.sel) { G.sel = -1; G.legal = []; }
      else {
        G.sel = i;
        G.legal = E.genLegal(G.state).filter(function (m) { return m.from === i; });
        sfx.click();
      }
      render();
    } else if (G.sel >= 0) {
      G.sel = -1; G.legal = []; sfx.illegal(); render();
    }
  }

  function askPromotion(cands) {
    G.pendingPromo = cands;
    var row = $("promo-row");
    row.innerHTML = "";
    var white = G.state.turn === "w";
    ["Q", "R", "B", "N"].forEach(function (t) {
      var b = document.createElement("button");
      b.textContent = GLYPH[white ? t : t.toLowerCase()];
      b.addEventListener("click", function () {
        $("ov-promo").classList.add("hidden");
        var mv = G.pendingPromo.filter(function (m) { return m.promo === t; })[0];
        G.pendingPromo = null;
        if (mv) playMove(mv);
      });
      row.appendChild(b);
    });
    $("ov-promo").classList.remove("hidden");
  }

  /* ---------------- 悔棋 ---------------- */
  function undo() {
    if (G.mode === "online") { sfx.illegal(); return; }
    if (G.thinking || G.moves.length === 0) { sfx.illegal(); return; }
    var n = 1;
    if (G.mode === "ai") {
      // 撤到再次轮到人类:通常撤 2 步;若 AI 尚未回应则撤 1 步
      n = (G.state.turn === G.humanSide) ? 2 : 1;
      n = Math.min(n, G.moves.length);
    }
    for (var k = 0; k < n; k++) { G.moves.pop(); G.fens.pop(); }
    G.state = E.parseFEN(G.fens[G.fens.length - 1]);
    G.over = false; G.result = null; G.reason = null;
    G.view = null; G.sel = -1; G.legal = [];
    hideOverlays();
    sfx.click();
    render();
    maybeAI();
  }

  /* ---------------- 复盘 ---------------- */
  function setView(v) {
    if (v === null || v >= G.fens.length - 1) G.view = null;
    else G.view = Math.max(0, v);
    G.sel = -1; G.legal = [];
    render();
  }
  function viewNow() { return G.view === null ? G.fens.length - 1 : G.view; }

  /* ---------------- PGN ---------------- */
  function pgn() {
    var names = { w: "白方", b: "黑方" };
    if (G.mode === "ai") {
      names[G.humanSide] = "Aurex";
      names[G.humanSide === "w" ? "b" : "w"] = "奕苑电脑·难度" + G.level;
    } else if (G.mode === "online") {
      names[G.netSide || "w"] = $("in-name").value || "Aurex";
      names[G.netSide === "w" ? "b" : "w"] = G.peerName || "对手";
    }
    var d = new Date();
    var pad = function (x) { return String(x).padStart(2, "0"); };
    var head = '[Event "奕苑对局"]\n[Site "AurexloveU.github.io/games"]\n[Date "' +
      d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()) + '"]\n[Round "-"]\n[White "' +
      names.w + '"]\n[Black "' + names.b + '"]\n[Result "' + (G.result || "*") + '"]\n\n';
    var body = "";
    for (var i = 0; i < G.moves.length; i++) {
      if (i % 2 === 0) body += (i / 2 + 1) + ". ";
      body += G.moves[i].san + " ";
    }
    body += G.result || "*";
    // 每 ~80 列折行
    var out = "", line = "";
    body.split(" ").forEach(function (w) {
      if ((line + w).length > 78) { out += line.trim() + "\n"; line = ""; }
      line += w + " ";
    });
    return head + out + line.trim() + "\n";
  }

  function exportPGN() {
    var blob = new Blob([pgn()], { type: "application/x-chess-pgn" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "aurex-chess-" + Date.now() + ".pgn";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
    sfx.click();
  }

  /* ---------------- 终局 ---------------- */
  function showResult(customTitle, customText) {
    var title, text;
    if (customTitle) { title = customTitle; text = customText || ""; }
    else {
      title = G.result === "1/2-1/2" ? "和 棋" : (G.result === "1-0" ? "白 方 胜" : "黑 方 胜");
      text = (REASON_TXT[G.reason] || G.reason || "") + " · " + (G.result || "");
      var meWin = null;
      if (G.mode === "ai") meWin = (G.result === "1-0") === (G.humanSide === "w") && G.result !== "1/2-1/2";
      if (G.mode === "online" && G.netSide) meWin = (G.result === "1-0") === (G.netSide === "w") && G.result !== "1/2-1/2";
      if (G.result === "1/2-1/2") sfx.win();
      else if (meWin === null) sfx.win();
      else (meWin ? sfx.win : sfx.lose)();
    }
    $("rs-title").textContent = title;
    $("rs-text").textContent = text;
    $("ov-result").classList.remove("hidden");
  }

  function hideOverlays() {
    $("ov-result").classList.add("hidden");
    $("ov-promo").classList.add("hidden");
  }

  /* ---------------- 联机 ---------------- */
  function netClient() {
    if (G.net) G.net.leave();
    G.net = new AurexNet.Client({
      url: $("in-server").value || AurexNet.defaultUrl(),
      game: "chess",
      name: $("in-name").value || "Aurex",
      onStatus: function (t) { $("net-status").textContent = t; },
      onError: function (t) { $("net-status").textContent = "⚠ " + t; sfx.illegal(); },
      onRoom: function (msg) {
        G.netSide = msg.side;
        $("room-code").textContent = msg.room;
        $("my-side-badge").textContent = msg.side === "w" ? "执白" : "执黑";
        $("room-info").classList.remove("hidden");
        $("net-status").textContent = "已入房,等待对手…";
      },
      onStart: function (msg) {
        G.netOn = true;
        if (msg && msg.players) {
          var others = msg.players.filter(function (p) { return p.side !== G.netSide; });
          G.peerName = others.length ? others[0].name : "对手";
          $("net-status").textContent = "对局开始:对手是「" + G.peerName + "」";
        }
        newGame();
      },
      onMove: function (data) {
        var mv = E.genLegal(G.state).filter(function (m) {
          return m.from === data.from && m.to === data.to && (m.promo || null) === (data.promo || null);
        })[0];
        if (mv) playMove(mv, true);
      },
      onPeerLeave: function () {
        $("net-status").textContent = "对方已离开房间。";
        if (!G.over) {
          G.over = true;
          G.result = G.netSide === "w" ? "1-0" : "0-1";
          G.reason = "peer-leave";
          render(); showResult();
        }
      },
      onResult: function (msg) {
        if (!G.over) {
          G.over = true; G.result = msg.result; G.reason = msg.reason || "resign";
          render();
        }
        var extra = "";
        if (msg.elo) {
          extra = "  ELO:" + msg.elo.map(function (p) {
            return p.name + " " + p.elo + (p.delta >= 0 ? " (+" + p.delta + ")" : " (" + p.delta + ")");
          }).join(" · ");
        }
        showResult(
          G.result === "1/2-1/2" ? "和 棋" : (G.result === "1-0" ? "白 方 胜" : "黑 方 胜"),
          (REASON_TXT[G.reason] || G.reason || "") + extra
        );
      }
    });
    return G.net;
  }

  /* ---------------- 模式与控件 ---------------- */
  function setMode(mode) {
    G.mode = mode;
    ["ai", "local", "online"].forEach(function (m) {
      $("mode-" + m).classList.toggle("on", m === mode);
    });
    $("ai-opts").classList.toggle("hidden", mode !== "ai");
    $("online-opts").classList.toggle("hidden", mode !== "online");
    $("btn-resign").classList.toggle("hidden", mode !== "online");
    $("btn-undo").disabled = mode === "online";
    if (mode !== "online" && G.net) { G.net.leave(); G.netOn = false; $("room-info").classList.add("hidden"); }
    if (mode !== "online") newGame();
    else { G.netOn = false; newGame(); $("net-status").textContent = "创建或加入房间开始联机。"; }
    sfx.click();
  }

  $("mode-ai").addEventListener("click", function () { setMode("ai"); });
  $("mode-local").addEventListener("click", function () { setMode("local"); });
  $("mode-online").addEventListener("click", function () { setMode("online"); });

  $("sel-side").addEventListener("change", function () { G.humanSide = this.value; newGame(); });
  $("sel-level").addEventListener("change", function () { G.level = parseInt(this.value, 10); });

  $("btn-new").addEventListener("click", function () {
    if (G.mode === "online") { $("net-status").textContent = "联机模式下请重新建房开始新对局。"; return; }
    sfx.click(); newGame();
  });
  $("btn-undo").addEventListener("click", undo);
  $("btn-flip").addEventListener("click", function () { G.flip = !G.flip; sfx.click(); render(); });
  $("btn-pgn").addEventListener("click", exportPGN);
  $("btn-resign").addEventListener("click", function () {
    if (G.mode === "online" && G.net && G.netOn && !G.over) G.net.resign();
  });

  $("btn-create").addEventListener("click", function () { netClient().createRoom(); });
  $("btn-join").addEventListener("click", function () { netClient().joinRoom($("in-room").value); });

  $("rp-first").addEventListener("click", function () { setView(0); });
  $("rp-prev").addEventListener("click", function () { setView(viewNow() - 1); });
  $("rp-next").addEventListener("click", function () { setView(viewNow() + 1); });
  $("rp-last").addEventListener("click", function () { setView(null); });
  $("rp-live").addEventListener("click", function () { setView(null); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") setView(viewNow() - 1);
    else if (e.key === "ArrowRight") setView(viewNow() + 1);
  });

  $("rs-new").addEventListener("click", function () {
    hideOverlays();
    if (G.mode === "online") $("net-status").textContent = "联机模式下请重新建房开始新对局。";
    else newGame();
  });
  $("rs-replay").addEventListener("click", function () {
    hideOverlays(); setView(0);
  });

  $("in-server").value = AurexNet.defaultUrl();

  buildBoard();
  newGame();
})();
</script>
</body>
</html>
